# Every long-running service carries a memory ceiling.
#
# Without one, any single container can consume the whole VPS: a traffic spike
# or a runaway query takes the box down rather than the service that caused it,
# and Caddy dies with everything else, so the site stops answering instead of
# degrading. A container that hits its ceiling is killed and restarted by
# `restart: unless-stopped`, which is a far better outcome than an OOM killer
# choosing a victim across the host.
#
# The defaults are deliberately generous, because a limit set below what a
# healthy process actually needs causes the very outage it is meant to prevent,
# and this file has to be safe on a VPS whose size it cannot see. Tighten them
# to the real machine with APP_MEMORY_LIMIT and friends in `.env` — a limit
# caps a container, it never reserves memory, so the total may exceed RAM.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Container logs are a fixed-size resource on this box. Docker's json-file
    # driver keeps them forever by default, so a noisy loop — or an
    # unauthenticated endpoint that emits a line per request — fills the disk
    # and takes down every service on it, including the database. Capped and
    # rotated instead.
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: '${LOG_MAX_FILES:-3}'
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beyond_every_art}
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-beyond_every_art}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bind to localhost only; the database is never exposed to the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      # Passed as build arguments, not only through `env_file` below: Next.js
      # bakes `NEXT_PUBLIC_*` into the client bundle during `pnpm build`, so a
      # value supplied at container start arrives too late for the browser.
      # Compose substitutes these from `.env` in this directory, which is the
      # same file `env_file` reads, so both halves stay in step from one place.
      args:
        NEXT_PUBLIC_CHECKOUT_URL_MONTHLY: ${NEXT_PUBLIC_CHECKOUT_URL_MONTHLY:-}
        NEXT_PUBLIC_CHECKOUT_URL_YEARLY: ${NEXT_PUBLIC_CHECKOUT_URL_YEARLY:-}
    restart: unless-stopped
    # Container logs are a fixed-size resource on this box. Docker's json-file
    # driver keeps them forever by default, so a noisy loop — or an
    # unauthenticated endpoint that emits a line per request — fills the disk
    # and takes down every service on it, including the database. Capped and
    # rotated instead.
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: '${LOG_MAX_FILES:-3}'
    # The highest ceiling of the four: this is the only service that renders
    # pages, and `sharp` processes images in-process, which spikes.
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2g}
    depends_on:
      postgres:
        condition: service_healthy
    # Production secrets (PAYLOAD_SECRET, S3_*, RESEND_*, ...) load from .env.
    # The file is optional so `docker compose config` works without one.
    #
    # PAYLOAD_SECRET is passed through with no default on purpose. It used to
    # fall back to a value written in this file, which meant a missing .env
    # produced a working stack signing its sessions with a string published in
    # a public repository — and that is exactly what happened here for several
    # weeks (docs/DEPLOYMENT_STATUS.md). Unset, the app now refuses to start
    # and says why (lib/security/secret.ts), so the failure is a failed deploy
    # rather than a silent one.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql://payload:payload@postgres:5432/beyond_every_art}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      # The app needs this too, not only Caddy: it is half of the origin
      # allowlist Payload checks session cookies against and builds
      # password-reset links from (`lib/security/origins.ts`). It arrives
      # through `env_file` when it is written in `.env`, but passing it here as
      # well means the app and the proxy cannot end up disagreeing about which
      # hostname serves the admin panel. No default on purpose — a wrong value
      # is worse than none, and none is handled.
      CMS_ADDRESS: ${CMS_ADDRESS:-}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/health/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      # Bind to localhost; Caddy terminates TLS and proxies public traffic.
      - '127.0.0.1:3000:3000'
    volumes:
      # Uploads live on disk (no object storage is configured), and Payload
      # resolves them to /app/media. Without this volume they sit in the
      # container's writable layer, which a deploy destroys: `up -d --build`
      # recreates the container, so every release silently discarded every
      # uploaded file while the database kept pointing at them. The symptom is
      # a 500 from /api/media/file/<name> and a broken image on the page.
      - media_data:/app/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Container logs are a fixed-size resource on this box. Docker's json-file
    # driver keeps them forever by default, so a noisy loop — or an
    # unauthenticated endpoint that emits a line per request — fills the disk
    # and takes down every service on it, including the database. Capped and
    # rotated instead.
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: '${LOG_MAX_FILES:-3}'
    # Caddy proxies and terminates TLS; it holds no page in memory. The point of
    # a ceiling here is that it is the last service that should ever be starved,
    # since it is what answers at all when the app behind it is struggling.
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-256m}
    depends_on:
      - app
    environment:
      # Set to your domain — the exact host the site canonicalises to, `www`
      # included if it has one (e.g. www.beyondeveryart.com) — for automatic
      # HTTPS. SITE_REDIRECT_FROM is the other name, permanently redirected to
      # it, and is left unset where that name does not resolve.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # The default is a name that resolves nowhere on purpose: an unset value
      # would make Caddy read the redirect block as a site called "" and fail to
      # start, and a real-looking default would have it request a certificate
      # for a domain this deployment does not own.
      SITE_REDIRECT_FROM: ${SITE_REDIRECT_FROM:-redirect-disabled.localhost}
      # Staff hostname serving Payload Admin and the MCP endpoint, e.g.
      # cms.beyondeveryart.com. See the Caddyfile.
      CMS_ADDRESS: ${CMS_ADDRESS:-cms.localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Applies pending schema migrations, then exits. Deliberately behind a
  # profile so `docker compose up` never starts it: the deploy waits on
  # container health with `--wait`, and a service that exits by design does not
  # fit that model. It is run explicitly instead, before the containers are
  # replaced, so a failed migration stops a deploy rather than half-completing
  # one:
  #
  #   docker compose build migrate && docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    profiles: ['migrate']
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql://payload:payload@postgres:5432/beyond_every_art}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    restart: 'no'
    volumes:
      # The same volume as `app`. This image is also what runs `migrate:ghost`,
      # and an import that wrote into its own throwaway container would leave
      # the media rows in the database with no files behind them.
      - media_data:/app/media

  # Nightly sweep that asks Stripe what it is actually billing and records the
  # answer. Webhooks are an optimisation over polling, not a guarantee, and once
  # Ghost is switched off nothing else is listening — so the cutover runbook
  # requires this to be scheduled before Ghost's Stripe connection is removed.
  #
  # It stays inert, and says so in its log, until STRIPE_SECRET_KEY exists. That
  # key arrives through the env file rather than being named below, so the
  # secret is never written into a committed file or shown by
  # `docker compose config`.
  reconcile:
    build:
      context: .
      target: reconciler
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: '${LOG_MAX_FILES:-3}'
    # One short-lived Node process a day, holding a page of subscriptions and a
    # page of members. It boots Payload, so it needs more than the backup job's
    # `pg_dump | gzip` pipeline and much less than the app's image processing.
    deploy:
      resources:
        limits:
          memory: ${RECONCILE_MEMORY_LIMIT:-1g}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql://payload:payload@postgres:5432/beyond_every_art}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      RECONCILE_CRON: ${RECONCILE_CRON:-0 4 * * *}
      RECONCILE_ON_START: ${RECONCILE_ON_START:-false}

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    # Container logs are a fixed-size resource on this box. Docker's json-file
    # driver keeps them forever by default, so a noisy loop — or an
    # unauthenticated endpoint that emits a line per request — fills the disk
    # and takes down every service on it, including the database. Capped and
    # rotated instead.
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: '${LOG_MAX_FILES:-3}'
    # `pg_dump | gzip` streams, so this stays flat regardless of database size.
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEMORY_LIMIT:-512m}
    depends_on:
      postgres:
        condition: service_healthy
    # Backups reuse the media R2 credentials (S3_*) plus BACKUP_* settings,
    # including BACKUP_ENCRYPTION_KEY — which arrives through the env file
    # rather than being named below, so the passphrase is never written into a
    # committed file or shown in `docker compose config`.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql://payload:payload@postgres:5432/beyond_every_art}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
