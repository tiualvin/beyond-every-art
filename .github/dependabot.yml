version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Before `dev-dependencies`, because Dependabot files a package under the
      # first group that matches. `eslint-config-next` is a dev dependency, so
      # without this it went into that group while `next` went out on its own:
      # #205 and #206 (Oct 2026) each moved one half, and each failed CI alone,
      # because tests/scripts/eslint-major.test.ts holds the two level.
      next:
        patterns: ['next', 'eslint-config-next', '@next/*']
      payload:
        patterns: ['payload', '@payloadcms/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-dependencies:
        dependency-type: development
    # Major upgrades to the framework packages can break the Payload/Next type
    # layer and are handled deliberately rather than automatically.
    #
    # This used to ignore majors for *every* package, which is why the security
    # advisories piled up: anything whose fix landed in a major release was
    # invisible, and Next drifted several minors behind while 26 advisories
    # accumulated against the pinned version. The blanket rule is now narrowed
    # to the packages that actually move together, so a major bump elsewhere
    # opens a pull request and CI decides whether it is safe.
    ignore:
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'payload'
        update-types: ['version-update:semver-major']
      - dependency-name: '@payloadcms/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # These three are held by something outside their own release notes, and
      # each already has a test saying so — but nothing here was stopping
      # Dependabot from re-proposing them, so the same rejected pull request
      # came back the week after it was closed.
      #
      # `eslint`: 10 cannot start at all while `eslint-config-next` is on 15
      # (@rushstack/eslint-patch refuses it). It unblocks with Next 16, which
      # `next` above already gates. See tests/scripts/eslint-major.test.ts.
      #
      # `@types/node`: the major tracks the Node this project runs, not the
      # newest published — types ahead of the runtime compile calls that throw
      # in production. It moves when `.nvmrc` does. See
      # tests/scripts/node-types.test.ts.
      #
      # `zod`: 4 fails typecheck in lib/mcp/tools.ts, because
      # `@payloadcms/plugin-mcp` types its `tools` field against its own zod 3
      # and a zod 4 schema is not structurally a zod 3 `ZodType`. It unblocks
      # when that plugin moves; `@payloadcms/*` above already gates the majors,
      # and its `latest` is the pinned 3.88.0. Costs no API in the meantime —
      # zod 3.25 ships zod 4 at `zod/v4`. See tests/scripts/zod-major.test.ts.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']

  # The companion app (docs/COMPANION_APP.md): its own lockfile, so its own
  # entry, and one grouped pull request a week rather than one per package.
  #
  # Expo-managed packages are ignored outright. The SDK decides their versions
  # together — React, React Native, every expo-* module, jest-expo — and moving
  # one alone produces a build `npx expo install --check` rejects. They move on
  # an SDK upgrade, with `npx expo install --fix`, which is a deliberate change
  # rather than a weekly one.
  #
  # ESLint is held on 9 for the reason the website's is: the plugins in
  # eslint-config-expo do not accept 10.
  - package-ecosystem: npm
    directory: /apps/companion
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      companion:
        patterns: ['*']
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
      - dependency-name: 'typescript'
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Dependabot does not recursively discover Dockerfiles below `directory`, so
  # the separately built backup image needs its own update entry.
  - package-ecosystem: docker
    directory: /docker/backup
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      backup-image:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
