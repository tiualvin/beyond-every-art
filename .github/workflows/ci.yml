name: CI
on:
  pull_request:
  push:
    branches: [main, work]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beyond_every_art
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payload -d beyond_every_art"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgresql://payload:payload@localhost:5432/beyond_every_art
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      # A fresh secret per run, rather than a literal in this file. The app
      # refuses to start in production on any value published in this
      # repository (lib/security/secret.ts), and a CI secret committed here
      # would be exactly that — while also being one copy-paste away from a
      # real deployment.
      - name: Generate a PAYLOAD_SECRET for this run
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # These four run first, and the order is load-bearing. `payload-types.ts`
      # is generated and gitignored, and any Payload CLI command that boots the
      # config writes it — so a step below that touches Payload would leave the
      # workspace with types a clean checkout does not have, and `typecheck`
      # would start passing on code that cannot build. That exact failure got
      # through once: a cast that only compiled against the generated types
      # passed here and broke the Docker build. Keep anything that boots Payload
      # underneath this block.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Automatic schema push is off in every environment, so the CI database
      # is built the same way production's is: by replaying the committed
      # migrations. Everything below that touches PostgreSQL depends on this.
      #
      # `payload migrate` can exit 0 without running at all — see
      # `scripts/run-migrations.mjs`, which `migrate:db` now goes through and
      # which detects and retries that case. The table check stays as a second
      # opinion: it confirms the schema really exists rather than trusting the
      # CLI's own account of itself, and it is what caught the problem
      # originally.
      - name: Run and verify database migrations
        run: |
          pnpm migrate:db
          if ! psql "$DATABASE_URI" -tAc "SELECT to_regclass('public.authors')" | grep -q 'authors'; then
            echo "::error::Migrations reported success but the schema is missing"
            exit 1
          fi
      # Guard the workflow that push used to hide. A field added to a
      # collection without a matching migration leaves CI and production
      # disagreeing about the schema, and the only symptom is a query failing
      # after deploy. `--skip-empty` writes nothing when the config and the
      # migrations already agree, so a new file here means one is missing.
      - name: Fail if a schema change has no migration
        run: |
          pnpm migrate:db:create ci_drift_check --skip-empty
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::A collection or global changed without a migration." \
              "Run 'pnpm migrate:db:create <name>' and commit the result."
            git status --porcelain migrations
            exit 1
          fi
      # The comparator CLI only invokes `main()` when it is the entry module, so
      # that `parseArgs` stays unit-testable. `--help` is handled inside
      # `main()`, which makes it a cheap proof that the guard still lets a real
      # invocation through. Without it a broken guard would exit 0 silently and
      # look like a clean rehearsal run.
      - name: Smoke test the migration comparator entry point
        run: pnpm migration:compare --help | grep -q -- '--target-max-pages'
      # Same guard, same reason, for the Ghost card inventory: `parseArgs` and
      # `main` are unit-tested through imports, so only a real invocation proves
      # the entry check still fires. This one also gates a rehearsal step —
      # `--fail-on-unhandled` is meant to stop a migration when a card has
      # nowhere to land — and a guard that never runs `main()` would exit 0 and
      # report a clean inventory for an export it never opened.
      - name: Smoke test the Ghost card inventory entry point
        run: pnpm inventory:ghost --help | grep -q -- '--fail-on-unhandled'
      # The strict flag has to fail a real export, not just a unit test: the
      # fixture carries an unhandled card, so a zero exit here means the gate
      # would wave a lossy migration through.
      - name: Verify the inventory gate fails on an unhandled card
        run: |
          if pnpm inventory:ghost --input tests/fixtures/ghost-card-gaps.json \
            --fail-on-unhandled; then
            echo "::error::inventory:ghost --fail-on-unhandled exited 0 despite an unhandled card"
            exit 1
          fi
      # Conflict fixture: duplicate slugs and missing authors/tags must still be
      # detected and reported, which is a dry-run-only expectation.
      - run: pnpm migrate:ghost --dry-run --input tests/fixtures/ghost-export.json
      # End-to-end migration check against the CI database. The importer writes
      # a conflict-free export for real, then the validator re-reads Payload and
      # must agree that every post, page, tag, and author landed with its slug,
      # draft state, and publication date intact. Running it twice also proves
      # the import is safe to rerun (it upserts by ghostID).
      #
      # Media is skipped: the fixture's asset URLs are synthetic and would need
      # outbound downloads to resolve.
      - name: Import the Ghost fixture into the CI database
        run: |
          pnpm migrate:ghost --skip-media --input tests/fixtures/ghost-export-clean.json
          pnpm migrate:ghost --skip-media --input tests/fixtures/ghost-export-clean.json
      - name: Validate the import against the Ghost fixture
        run: |
          pnpm migrate:validate --input tests/fixtures/ghost-export-clean.json
          jq -e '.ok == true' validation-report.json > /dev/null
      # The members CSV is the one Ghost export produced by hand, at cutover
      # time, from a live admin screen — so its write path must not be first
      # exercised there. Both fixtures are synthetic, and named clear of
      # `.gitignore`'s `ghost-members*.csv` rule, which is there to stop a real
      # member export ever being committed.
      #
      # The conflict fixture proves the dry run names colliding CSV lines while
      # they are still free to fix: email and ghostID are unique in the
      # collection, so a real import that meets a collision is rejected by
      # Postgres part-way through, with some members written and the rest not.
      - name: Report member CSV conflicts without importing
        run: |
          pnpm migrate:members --dry-run --input tests/fixtures/members-conflicts.csv
          jq -e '.conflicts.duplicateEmails == [{"rows": [2, 4]}]' members-report.json > /dev/null
          jq -e '.conflicts.duplicateGhostIDs == [{"rows": [3, 5]}]' members-report.json > /dev/null
          jq -e '.skipped == [{"row": 6, "reason": "missing email address"}]' members-report.json > /dev/null
          jq -e '.warnings | length == 2' members-report.json > /dev/null
      # And the clean fixture proves the import itself. Twice, so the upsert on
      # `ghostID` is demonstrated to be rerunnable rather than assumed, and the
      # unique indexes are actually met. The row counts are read back from
      # PostgreSQL as a second opinion on the script's own report: two members
      # are `paid` only because the mapper derived it from a Stripe customer id
      # and an explicit status, which is the part worth proving against the
      # real column rather than a stub.
      - name: Import the members fixture into the CI database
        run: |
          pnpm migrate:members --input tests/fixtures/members-clean.csv
          jq -e '.created == 4 and .updated == 0 and (.errors | length) == 0' members-report.json > /dev/null
          pnpm migrate:members --input tests/fixtures/members-clean.csv
          jq -e '.created == 0 and .updated == 4 and (.errors | length) == 0' members-report.json > /dev/null
          test "$(psql "$DATABASE_URI" -tAc 'SELECT count(*) FROM members')" = 4
          test "$(psql "$DATABASE_URI" -tAc "SELECT count(*) FROM members WHERE status = 'paid'")" = 2
      # "A database backup has been successfully restored" is an acceptance
      # criterion, and it was a thing someone did once by hand. A backup nobody
      # has restored is a hope, and the failure modes are quiet ones: a dump
      # that streams to a truncated file, an archive that decompresses but
      # replays with errors, a passphrase the restore cannot use.
      #
      # This runs the real production shape — encrypted, gzipped, restored
      # through psql with ON_ERROR_STOP — against the database the steps above
      # just filled, and restores into a scratch database so the source stays
      # intact to compare against. Both scripts run fully offline here
      # (`--skip-upload --output`, `--input-file --target`), so no bucket and no
      # credentials are involved: what is being tested is the archive and the
      # restore, not R2's availability today.
      - name: Restore drill — back up, restore into a scratch database, compare
        env:
          RESTORE_TARGET: postgresql://payload:payload@localhost:5432/restore_drill
        run: |
          # A dump is a copy of every member record. Even here, where the
          # database holds fixtures, it is written outside the checkout so the
          # habit does not travel to a machine where it holds real ones.
          drill="$RUNNER_TEMP/restore-drill"
          mkdir -p "$drill"
          export BACKUP_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          pnpm --silent backup:db --skip-upload --output "$drill/db.sql.gz.enc" \
            > "$drill/backup-report.json"
          jq -e '.encrypted == true and .uploaded == false' "$drill/backup-report.json" > /dev/null
          psql "$DATABASE_URI" -q -c 'DROP DATABASE IF EXISTS restore_drill' \
            -c 'CREATE DATABASE restore_drill OWNER payload'
          # DATABASE_URI is dropped for this one command, and no S3_* variable
          # exists anywhere in this job: both halves of a file-to-target restore
          # run on nothing but the archive and the target, which is what a
          # recovery machine will have.
          env -u DATABASE_URI pnpm --silent restore:db --input-file "$drill/db.sql.gz.enc" \
            --target "$RESTORE_TARGET" --yes > "$drill/restore-report.json"
          jq -e '.encrypted == true and .restored == true' "$drill/restore-report.json" > /dev/null
          # Every table named here is filled by the steps above, so a zero row
          # count means the drill compared nothing and called it a match.
          for table in posts pages tags authors members payload_migrations; do
            source_rows=$(psql "$DATABASE_URI" -tAc "SELECT count(*) FROM $table")
            restored_rows=$(psql "$RESTORE_TARGET" -tAc "SELECT count(*) FROM $table")
            if [ "$source_rows" != "$restored_rows" ] || [ "$source_rows" = 0 ]; then
              echo "::error::$table: $source_rows rows backed up, $restored_rows restored"
              exit 1
            fi
          done
          # Matching row counts say the rows arrived, not that they arrived
          # intact. Point the validator at the restored copy and it has to
          # reach the same verdict it reached on the original.
          DATABASE_URI="$RESTORE_TARGET" pnpm migrate:validate \
            --input tests/fixtures/ghost-export-clean.json \
            --report "$drill/validation.json"
          jq -e '.ok == true' "$drill/validation.json" > /dev/null
          rm -rf "$drill"
      - run: pnpm build

  # The dependency audit used to be a job here. It now lives in its own
  # workflow (`.github/workflows/audit.yml`) so it can also run on a schedule:
  # a new advisory published upstream turns it red without anyone pushing, and
  # this workflow only runs when somebody does.

  browser-smoke:
    # Browser-level launch checks against a seeded, disposable PostgreSQL
    # database. This catches route, metadata, privacy, redirect, and responsive
    # navigation regressions that unit tests and a production build cannot.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beyond_every_art
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payload -d beyond_every_art"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      DATABASE_URI: postgresql://payload:payload@localhost:5432/beyond_every_art
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      # A fresh secret per run, rather than a literal in this file. The app
      # refuses to start in production on any value published in this
      # repository (lib/security/secret.ts), and a CI secret committed here
      # would be exactly that — while also being one copy-paste away from a
      # real deployment.
      - name: Generate a PAYLOAD_SECRET for this run
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Schema push is off, so the seeds have no tables to write into until the
      # committed migrations have built them. Same table check as in `checks` —
      # see the comment there for why.
      - name: Run and verify database migrations
        run: |
          pnpm migrate:db
          if ! psql "$DATABASE_URI" -tAc "SELECT to_regclass('public.authors')" | grep -q 'authors'; then
            echo "::error::Migrations reported success but the schema is missing"
            exit 1
          fi
      - run: pnpm seed:dev
      - run: pnpm seed:e2e
      - run: pnpm build
      # Assemble the standalone output exactly as the runtime image does. The
      # standalone bundle ships `server.js` and its traced dependencies but not
      # `.next/static`, which the Dockerfile copies in beside it. Without this
      # the smoke suite would serve a build missing every static asset.
      - run: cp -r .next/static .next/standalone/.next/static
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  backup-image:
    # Build-only smoke test: the backup image ships separately from the app
    # image, so a broken Dockerfile would otherwise surface at deploy time.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the backup image
        run: docker build --file docker/backup/Dockerfile --tag beyond-every-art-backup:ci .

  app-image:
    # Grants only what the publish step below needs, on top of the workflow's
    # `contents: read`. Naming both is required: a job-level `permissions` block
    # replaces the workflow default rather than adding to it.
    permissions:
      contents: read
      packages: write
    # Build-only smoke test for the main app image. `pnpm build` in `checks`
    # only proves the Next.js build succeeds outside a container; it does not
    # exercise the Dockerfile itself, so a broken multi-stage COPY (e.g.
    # referencing a directory that does not exist in this repo) would
    # otherwise only surface when the deploy job runs `docker compose build`
    # against the VPS.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: docker build --tag beyond-every-art-app:ci .
      # The migrator stage is not a dependency of the runtime image, so the
      # build above never touches it. Without this, a broken migrator stage
      # would surface for the first time during a deploy — at the step that now
      # runs before containers are replaced, which is the worst place to
      # discover it.
      - name: Build the migration image
        run: docker build --target migrator --tag beyond-every-art-migrator:ci .
      # The reconciliation scheduler runs that same image with the entrypoint
      # `docker-compose.yml` names, so the image above already covers its build.
      # What nothing else covers is the script itself: a container that only
      # runs its entrypoint at 02:30 is one whose failures are easy to miss, so
      # parse it here rather than discovering a syntax error overnight.
      - name: Check the reconciliation entrypoint parses
        run: |
          docker run --rm --entrypoint sh beyond-every-art-migrator:ci \
            -c 'sh -n /app/docker/reconcile/entrypoint.sh'
      # The images are only half of it: the deploy runs `docker compose up`, so
      # a service that names a stage that does not exist, or mistypes a key,
      # fails on the VPS rather than here. Interpolation is checked too, which
      # is why a placeholder secret is supplied — `config` renders the file, it
      # does not start anything.
      - name: Validate the Compose file
        env:
          PAYLOAD_SECRET: not-a-real-secret-compose-render-only
        run: docker compose config --quiet
      # Caddy is built from source rather than pulled, so a broken
      # `xcaddy build` — an upstream module that stops compiling, say — would
      # otherwise first appear on the VPS, in the deploy that replaces the only
      # thing answering on ports 80 and 443. Same reasoning as the two builds
      # above, applied to the service whose failure is hardest to recover from
      # remotely.
      #
      # It is also published, and that is not a convenience. Compiling Caddy
      # with this module set pulls in the AWS, GCP and Smithy SDKs, and on the
      # 4GB production VPS the link step ran for seventeen minutes without
      # finishing and killed the deploy on its own 20-minute timeout (run
      # 33043176270, 2026-08-27). The same build takes under a minute on a
      # runner. Nothing about that is going to improve on its own: every cache
      # invalidation — an upstream `caddy:2-builder-alpine` push, a pruned
      # layer, a rebuilt box — puts a seventeen-minute Go build in front of a
      # deploy that is allowed twenty.
      #
      # So the runner does it once and the VPS pulls the result. The `build:`
      # section stays in docker-compose.yml as a fallback, so a machine that
      # cannot reach the registry can still come up.
      - name: Build the Caddy image
        run: docker build --file docker/caddy/Dockerfile --tag beyond-every-art-caddy:ci .

      # The default docker driver cannot emit a manifest list, and the two steps
      # below need one. No QEMU alongside it: the builder stage is pinned to the
      # native platform and Go cross-compiles, so nothing foreign is ever
      # executed — the arm64 stage only copies a binary in.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # The production VPS is arm64 and this runner is amd64, so the build above
      # proves the Dockerfile compiles and proves nothing about whether the
      # result can execute where it is going. It could not, on 2026-08-27: the
      # container exec-failed and restarted forever while the deploy reported
      # success. Building the foreign architecture here is the check.
      - name: Build the Caddy image for the architecture the server runs
        run: |
          docker buildx build --platform linux/arm64 \
            --file docker/caddy/Dockerfile --tag beyond-every-art-caddy:ci-arm64 .

      # Only for real pushes to main: pull requests keep the build-only check
      # above, which is what makes a broken Dockerfile fail review rather than
      # deploy. `github.actor` and GITHUB_TOKEN authenticate the push; no
      # long-lived registry credential exists anywhere.
      - name: Publish the Caddy image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}-caddy
        run: |
          printf '%s' "$GITHUB_TOKEN" \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          # Two tags on purpose. `main` is what the VPS follows, so a deploy
          # needs no knowledge of which commit built the image; the SHA tag is
          # what makes a rollback nameable after the fact.
          # Both architectures, in one manifest list, so the server pulls the
          # one it can run. amd64 is not there for the server — it is there so
          # a developer machine and this runner can pull the same reference.
          #
          # Built rather than tagged: a multi-platform result cannot live in
          # the local image store, so buildx assembles and pushes it in one
          # step. The layers are already cached by the two builds above.
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file docker/caddy/Dockerfile \
            --tag "$REGISTRY_IMAGE:main" \
            --tag "$REGISTRY_IMAGE:${GITHUB_SHA::12}" \
            --push .
          docker logout ghcr.io

  deploy:
    # Only after all builds are proven good, and only for real pushes to main
    # (not pull requests, and not the `work` branch CI also runs on).
    needs: [checks, browser-smoke, backup-image, app-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Sized for the worst case rather than the normal one. A deploy that pulls
    # Caddy takes a couple of minutes; one that has to fall back to building it
    # takes closer to twenty on this hardware. The 2026-08-27 failure was that
    # build being killed part-way by a budget set for the normal case, which
    # left the checkout advanced and the containers not replaced — the most
    # confusing state of the three.
    timeout-minutes: 35
    # Never let two deploys mutate the same checkout/Compose project at once.
    # A running production deploy is allowed to finish instead of being
    # cancelled halfway through a build or container replacement.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # The host key decides who the deploy key is handed to.
      #
      # `ssh-keyscan` on its own asks the host at the other end of the
      # connection to introduce itself and then believes the answer, which is
      # the thing host key verification exists to not do: whoever answers for
      # VPS_HOST at deploy time — a hijacked DNS record, anything on the path —
      # is trusted, and receives an SSH key with production access. Pinning the
      # expected key in VPS_SSH_HOST_KEY makes the check mean something.
      #
      # Scanning remains as a fallback so setting the secret is a change the
      # repository owner makes deliberately rather than one a failed deploy
      # forces at a bad moment. Get the value with
      # `ssh-keyscan -t ed25519 <host>` run from somewhere you trust, or read it
      # off the VPS itself with `cat /etc/ssh/ssh_host_ed25519_key.pub`, and the
      # fallback stops being used from the next deploy on.
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy-ssh/deploy_key
          KNOWN_HOSTS: ${{ runner.temp }}/deploy-ssh/known_hosts
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 "$(dirname "$DEPLOY_KEY")"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$DEPLOY_KEY"
          if [ -n "$VPS_SSH_HOST_KEY" ]; then
            printf '%s\n' "$VPS_SSH_HOST_KEY" > "$KNOWN_HOSTS"
            echo "Pinned the VPS host key from VPS_SSH_HOST_KEY."
          else
            echo "::warning::VPS_SSH_HOST_KEY is not set, so this deploy trusts" \
              "whatever host key answers for the VPS. Set the secret to" \
              "'ssh-keyscan -t ed25519 <host>' output taken from a trusted network."
            ssh-keyscan -T 10 -H "$VPS_HOST" > "$KNOWN_HOSTS"
          fi
      - name: Deploy the tested commit and verify readiness
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy-ssh/deploy_key
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          KNOWN_HOSTS: ${{ runner.temp }}/deploy-ssh/known_hosts
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf -v remote_path '%q' "$DEPLOY_PATH"
          printf -v remote_sha '%q' "$DEPLOY_SHA"
          timeout --signal=TERM 30m ssh \
            -i "$DEPLOY_KEY" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=3 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH=$remote_path DEPLOY_SHA=$remote_sha sh -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"

          deployment_diagnostics() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              echo "Deployment failed; current container state:" >&2
              docker compose ps --all >&2 || true
              echo "Recent service logs:" >&2
              docker compose logs --no-color --tail=100 \
                app postgres caddy backup >&2 || true
            fi
            exit "$status"
          }
          trap deployment_diagnostics EXIT

          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          current_sha=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$DEPLOY_SHA" "$current_sha"; then
            echo "Skipping $DEPLOY_SHA; $current_sha is already deployed and is at least as new."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$current_sha" "$DEPLOY_SHA"; then
            echo "Refusing a non-fast-forward deployment from $current_sha to $DEPLOY_SHA." >&2
            exit 1
          fi
          git reset --hard "$DEPLOY_SHA"
          echo "Deploying tested commit $(git rev-parse HEAD)"

          # Schema migrations run to completion before any container is
          # replaced. A migration that fails then leaves the previous release
          # serving an unchanged database, instead of starting a new release
          # against a schema it does not match. `run` starts the postgres
          # dependency and waits for its health check on its own.
          docker compose build migrate
          docker compose run --rm migrate

          # Caddy is pulled rather than built: compiling it here is what
          # killed the 2026-08-27 deploy, seventeen minutes into a Go link step
          # on a 4GB box. A failure here is survivable — the compose file keeps
          # the Dockerfile, so `up` builds it instead — but it is not silent,
          # because the fallback is the slow path this change exists to avoid
          # and "the deploy got mysteriously slower" is not a diagnosis.
          #
          # The most likely cause by far is package visibility: images published
          # to GHCR are private until someone makes them public, and this host
          # pulls anonymously. See docs/EDGE_PROTECTION.md.
          if ! docker compose pull caddy; then
            echo "WARNING: could not pull the Caddy image; falling back to" \
              "building it here, which takes ~17 minutes on this machine." >&2
            echo "Check that ghcr.io/tiualvin/beyond-every-art-caddy is" \
              "public, or that this host is authenticated to ghcr.io." >&2
          fi

          # Everything that genuinely has to be built from this checkout. The
          # app carries the commit's code, and `backup` carries the scripts the
          # nightly job and the restore drill run. Named explicitly rather than
          # left to `up --build`, which would rebuild Caddy too and put the Go
          # toolchain back in front of every deploy.
          #
          # One at a time, deliberately. Naming both in a single invocation lets
          # Compose hand them to bake, which builds them in parallel — and this
          # machine has 3.7GB of RAM, no swap at all, and about 2GB actually
          # available with the stack running. The Next.js production build alone
          # gets close to that; a second build alongside it went over on
          # 2026-08-27 and the kernel killed the whole thing
          # (`failed to execute bake: signal: killed`).
          #
          # Sequential costs about twenty seconds and halves the peak. It is not
          # a substitute for swap on this box, which is the actual fix — see
          # docs/DEPLOYMENT_STATUS.md — but it stops the deploy being the thing
          # that discovers the ceiling.
          docker compose build app
          docker compose build backup

          docker compose up -d --wait --wait-timeout 180
          docker compose ps --all

          # `--wait` cannot speak for Caddy. The service has no healthcheck, and
          # for a service without one Compose treats "running" as ready — which
          # a container that starts and then immediately exec-fails satisfies
          # for just long enough. On 2026-08-27 the deploy printed
          # "Container beyond-every-art-caddy-1 Healthy" four seconds before
          # `ps` showed it restarting, and still exited 0.
          #
          # Nothing else here would catch it either: the health probe below
          # fetches /health from inside the app container, so it never crosses
          # the proxy. That is the whole reason a green deploy could sit on top
          # of a site that answered nothing on 80 or 443.
          #
          # Settle first, because a crash loop passes through "running" on its
          # way round.
          sleep 15
          # Read through `docker inspect` rather than `compose ps --format`:
          # the Go-template form of the latter depends on the Compose version
          # installed on the server, and a gate that fails because of its own
          # formatting is worse than no gate.
          caddy_id=$(docker compose ps -q caddy || true)
          if [ -n "$caddy_id" ]; then
            caddy_state=$(docker inspect -f '{{.State.Status}}' "$caddy_id" 2>/dev/null || echo unreadable)
          else
            caddy_state=missing
          fi
          if [ "$caddy_state" != "running" ]; then
            echo "Caddy is not running after the deploy (state: $caddy_state)." >&2
            echo "The site answers nothing on 80/443 in this state." >&2
            docker compose logs --no-color --tail=50 caddy >&2
            exit 1
          fi
          docker compose exec -T app node -e '
            fetch("http://127.0.0.1:3000/health/", {
              signal: AbortSignal.timeout(10000),
            })
              .then(async (response) => {
                const body = await response.text()
                if (!response.ok) {
                  throw new Error(`health returned ${response.status}: ${body}`)
                }
                console.log(`Verified internal app health: ${body}`)
              })
              .catch((error) => {
                console.error(error)
                process.exit(1)
              })
          '
          trap - EXIT
          REMOTE
      - name: Remove the SSH key
        if: always()
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy-ssh/deploy_key
          KNOWN_HOSTS: ${{ runner.temp }}/deploy-ssh/known_hosts
        run: |
          if [ -f "$DEPLOY_KEY" ]; then
            shred --remove "$DEPLOY_KEY" || rm -f "$DEPLOY_KEY"
          fi
          rm -f "$KNOWN_HOSTS"
