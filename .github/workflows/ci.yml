name: CI
on:
  pull_request:
  push:
    branches: [main, work]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beyond_every_art
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payload -d beyond_every_art"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgresql://payload:payload@localhost:5432/beyond_every_art
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_SECRET: synthetic-ci-secret-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Conflict fixture: duplicate slugs and missing authors/tags must still be
      # detected and reported, which is a dry-run-only expectation.
      - run: pnpm migrate:ghost --dry-run --input tests/fixtures/ghost-export.json
      # End-to-end migration check against the CI database. The importer writes
      # a conflict-free export for real, then the validator re-reads Payload and
      # must agree that every post, page, tag, and author landed with its slug,
      # draft state, and publication date intact. Running it twice also proves
      # the import is safe to rerun (it upserts by ghostID).
      #
      # Media is skipped: the fixture's asset URLs are synthetic and would need
      # outbound downloads to resolve.
      - name: Import the Ghost fixture into the CI database
        run: |
          pnpm migrate:ghost --skip-media --input tests/fixtures/ghost-export-clean.json
          pnpm migrate:ghost --skip-media --input tests/fixtures/ghost-export-clean.json
      - name: Validate the import against the Ghost fixture
        run: |
          pnpm migrate:validate --input tests/fixtures/ghost-export-clean.json
          jq -e '.ok == true' validation-report.json > /dev/null
      - run: pnpm build

  backup-image:
    # Build-only smoke test: the backup image ships separately from the app
    # image, so a broken Dockerfile would otherwise surface at deploy time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backup image
        run: docker build --file docker/backup/Dockerfile --tag beyond-every-art-backup:ci .

  deploy:
    # Only after both builds are proven good, and only for real pushes to main
    # (not pull requests, and not the `work` branch CI also runs on).
    needs: [checks, backup-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Pull latest main and rebuild on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
              set -e
              cd "${{ secrets.VPS_DEPLOY_PATH }}"
              git fetch origin main
              git reset --hard origin/main
              docker compose up -d --build
            '
